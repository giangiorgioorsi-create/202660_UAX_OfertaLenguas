<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://canva.link/ip80odtkn9luggs">
<title>Nueva página disponible</title>
<style>
  :root{
    --azul: #0b2545;
    --azul-suave: #13315c;
    --oro: #c9a24b;
    --texto: #eef1f6;
    --texto-suave: #a9b6cc;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:radial-gradient(circle at 30% 20%, var(--azul-suave), var(--azul) 60%);
    font-family:Georgia, 'Times New Roman', serif;
    color:var(--texto);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .card{
    max-width:480px;
  }
  .eyebrow{
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--oro);
    font-family:Helvetica, Arial, sans-serif;
    margin-bottom:18px;
  }
  h1{
    font-size:1.9rem;
    line-height:1.3;
    margin:0 0 16px;
    font-weight:400;
  }
  p{
    font-family:Helvetica, Arial, sans-serif;
    color:var(--texto-suave);
    font-size:.98rem;
    line-height:1.6;
    margin:0 0 32px;
  }
  a.boton{
    display:inline-block;
    font-family:Helvetica, Arial, sans-serif;
    background:var(--oro);
    color:var(--azul);
    text-decoration:none;
    font-weight:700;
    padding:14px 34px;
    border-radius:2px;
    letter-spacing:.03em;
    transition:transform .15s ease, background .15s ease;
  }
  a.boton:hover{
    background:#dab766;
    transform:translateY(-1px);
  }
  .nota{
    margin-top:28px;
    font-size:.8rem;
    color:var(--texto-suave);
    opacity:.7;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Esta página se actualizó</div>
    <h1>La información se mudó a nuestra nueva página</h1>
    <p>Serás redirigido automáticamente en unos segundos. Si no ocurre, entra con el botón de abajo.</p>
    <a class="boton" href="https://canva.link/ip80odtkn9luggs">Ir a la nueva página</a>
    <div class="nota">Redirección automática en 3 segundos…</div>
  </div>
</body>
</html>
